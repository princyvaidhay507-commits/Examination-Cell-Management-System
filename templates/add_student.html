{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}


{% block content %}


<div class="container mt-5">


    <div class="card shadow p-4">


        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold">
                Add New Student
            </h2>


            <a href="/dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>




        <form method="POST" action="/add_student">


            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Roll Number
                    </label>

                    <input type="text"
                           name="roll"
                           class="form-control"
                           placeholder="Enter Roll Number"
                           required>

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter Name"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Branch
                    </label>

                    <input type="text"
                           name="branch"
                           class="form-control"
                           placeholder="CSE"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Semester
                    </label>

                    <input type="text"
                           name="semester"
                           class="form-control"
                           placeholder="6th Semester"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <input type="text"
                           name="subject"
                           class="form-control"
                           placeholder="DBMS"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Marks
                    </label>

                    <input type="number"
                           name="marks"
                           class="form-control"
                           placeholder="Enter Marks"
                           required>

                </div>



            </div>



            <button type="submit"
                    class="btn btn-success">

                Save Student

            </button>


        </form>


    </div>


</div>



{% endblock %}
