{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}


{% block content %}


<div class="container mt-5">


    <div class="card shadow p-4">


        <div class="d-flex justify-content-between align-items-center mb-4">


            <h2 class="fw-bold">
                Edit Student Details
            </h2>


            <a href="/dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>


        </div>




        <form method="POST" action="">


            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Roll Number
                    </label>

                    <input type="text"
                           name="roll"
                           class="form-control"
                           value="{{ student.roll }}"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ student.name }}"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Branch
                    </label>

                    <input type="text"
                           name="branch"
                           class="form-control"
                           value="{{ student.branch }}"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Semester
                    </label>

                    <input type="text"
                           name="semester"
                           class="form-control"
                           value="{{ student.semester }}"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <input type="text"
                           name="subject"
                           class="form-control"
                           value="{{ student.subject }}"
                           required>

                </div>




                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Marks
                    </label>

                    <input type="number"
                           name="marks"
                           class="form-control"
                           value="{{ student.marks }}"
                           required>

                </div>


            </div>




            <button type="submit"
                    class="btn btn-warning">

                Update Student

            </button>



        </form>


    </div>


</div>



{% endblock %}
